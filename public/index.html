<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盲文标签排版台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>盲文标签排版台</h1>
    <p class="subtitle">六点一级盲文 · 整词换行 · 毫米坐标凸点 SVG</p>
  </header>

  <main>
    <!-- 左侧：参数表单 -->
    <section class="panel form-panel" aria-label="排版参数">
      <label class="field">
        <span>标签文字（英文）</span>
        <textarea id="text" rows="4" maxlength="500"
          placeholder="例如：EXIT Door 2">EXIT Door 2</textarea>
      </label>

      <div class="grid-2">
        <label class="field">
          <span>板材宽度 (mm)</span>
          <input id="plateWidth" type="number" min="1" step="0.5" value="100">
        </label>
        <label class="field">
          <span>板材高度 (mm)</span>
          <input id="plateHeight" type="number" min="1" step="0.5" value="50">
        </label>
        <label class="field">
          <span>点距 (mm)</span>
          <input id="dotSpacing" type="number" min="0.5" step="0.1" value="2.5">
        </label>
        <label class="field">
          <span>行距 (mm)</span>
          <input id="lineSpacing" type="number" min="1" step="0.5" value="10">
        </label>
      </div>

      <details class="advanced">
        <summary>高级设置</summary>
        <div class="grid-2">
          <label class="field">
            <span>四周边距 (mm)</span>
            <input id="margin" type="number" min="0" step="0.5" value="5">
          </label>
          <label class="field">
            <span>字距 (mm，留空=1.4×点距)</span>
            <input id="cellGap" type="number" min="0" step="0.1" placeholder="自动">
          </label>
          <label class="field">
            <span>凸点直径 (mm，留空=0.6×点距)</span>
            <input id="dotDiameter" type="number" min="0.1" step="0.1" placeholder="自动">
          </label>
        </div>
      </details>

      <div id="errors" class="errors" role="alert" hidden></div>

      <div id="stats" class="stats" hidden></div>

      <div class="actions">
        <button id="downloadSvg" type="button" disabled>下载 SVG</button>
        <button id="downloadJson" type="button" disabled>下载排版 JSON</button>
      </div>
    </section>

    <!-- 右侧：实时预览 -->
    <section class="panel preview-panel" aria-label="排版预览">
      <div class="preview-head">
        <h2>实时预览</h2>
        <span id="brailleLine" class="braille-line" title="盲文 Unicode 对照"></span>
      </div>
      <div id="preview" class="preview">
        <p class="placeholder">输入参数后此处显示带毫米坐标的凸点 SVG 预览</p>
      </div>
    </section>
  </main>

  <footer>
    <p>转换规则：大写字母前加大写前缀 ⠠；连续数字段仅在段首加一个数字前缀 ⠼；按盲文单元整词换行，放不下时给出原因，绝不裁切。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
